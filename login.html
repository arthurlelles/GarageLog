<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <link rel="icon" href="img/favpng_e4d9513455ed0e2b7a1973206c502229.png" type="image/png">
        <title>GarageLog - Login</title>
        <link rel="stylesheet" href="css/estilo.css" type="text/css">
    </head>
    <body>

        <div class="header">
            <a href="index.html" class="logo">GarageLog</a>
        </div>

        <div class="form-container">
            <h2>Entrar</h2>

            <div class="form-group">
                <label>Usuário</label>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha">
            </div>

            <button class="btn" onclick="entrar()">Entrar</button>

            <div id="mensagem"></div>

            <a href="garagem.html" id="link-garagem" class="btn" style="display: none;">Acessar minha garagem &rarr;</a>

            <p class="form-footer">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

        <script src="js/login.js"></script>
    </body>
</html>
