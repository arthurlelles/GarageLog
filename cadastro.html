<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" href="img/favpng_e4d9513455ed0e2b7a1973206c502229.png" type="image/png">
        <title>GarageLog - Criar Conta</title>
        <link rel="stylesheet" href="css/estilo.css" type="text/css">
    </head>
    <body>

        <div class="header">
            <a href="index.html" class="logo">GarageLog</a>
        </div>

        <div class="form-container">
            <h2>Criar Conta</h2>

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome">
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="text" id="email">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha">
            </div>

            <div class="form-group">
                <label>Confirmar Senha</label>
                <input type="password" id="confirmar-senha">
            </div>

            <button class="btn" onclick="criarConta()">Criar Conta</button>

            <div id="mensagem"></div>

            <a href="garagem.html" id="link-garagem" class="btn" style="display: none;">Ir para minha garagem &rarr;</a>

            <p class="form-footer">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>

        <script src="js/cadastro.js"></script>
    </body>
</html>
