<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>   
    <div class="container-principal">      
        <div class="cadastro-box">
            <h2>Criar Conta</h2>
            <p>Registre-se para gerenciar seus veículos.</p>

            <form action="/salvar_usuario" method="POST">
                
                <div class="grupo-input">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="grupo-input">
                    <label for="confirmar_senha">Confirmar Senha</label>
                    <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-cadastrar">Cadastrar</button>
                
            </form>

            <div class="link-login">
                Já tem conta? <a href="login.html">Faça Login</a>
            </div>
        </div>
    </div>
</body>
</html>
