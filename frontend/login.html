<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="header-simples">
        <!-- Botão de Voltar -->
        <a href="index.html" class="btn-voltar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar
        </a>
     </header>   
     <div class="container-principal">
        <div class="login-box">
            <h2>Faça Login</h2>
            <p>Logue na sua conta para gerenciar suas manutenções.</p>

            <form action="/salvar_usuario" method="POST">

                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-logar">Logar</button>
                
            </form>

            <div class="link-cadastro">
                Ainda não possui uma conta? <a href="cadastro.html">Cadastra-se</a>
            </div>
        </div>
    </div>
</body>
</html>
