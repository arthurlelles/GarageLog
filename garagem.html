<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">

        <title>GarageLog - Minha Garagem</title>
        <link rel="stylesheet" href="css/estilo.css" type="text/css">
    </head>
    <body>

        <!-- HEADER -->
        <div class="header">
            <a href="index.html" class="logo">GarageLog</a>
            <nav class="nav">
                <span>Olá, André</span>
                <a href="index.html">Sair</a>
            </nav>
        </div>

        <!-- CARDS -->
        <div class="container">

                <h2 class="page-title">Minha Garagem</h2>
                <a href="cadastro-carro.html" class="btn btn-small">+ Adicionar Carro</a>
            </div>

            <div class="cards">

                <div class="card">
                    <img src="img/e30.jpeg" width="200" height="130" alt="BMW M3 E30">

                    <p>Ano: 1990</p>
                    <p>Placa: ABC-1234</p>
                    <p>KM: 85.000</p>

                    </div>
                </div>

                <div class="card">
                    <img src="img/e36.jpeg" width="200" height="130" alt="BMW M3 E36">
                    <h3>BMW M3 E36</h3>
                    <p>Ano: 1997</p>
                    <p>Placa: DEF-5678</p>
                    <p>KM: 142.000</p>
                    <div class="card-actions">
                        <a href="manutencoes.html" class="btn btn-small">Manutenções</a>
                        <a href="#" class="btn btn-small btn-danger">Excluir</a>
                    </div>
                </div>

                <div class="card">
                    <img src="img/e46.jpeg" width="200" height="130" alt="BMW M3 E46">
                    <h3>BMW M3 E46</h3>
                    <p>Ano: 2005</p>
                    <p>Placa: GHI-9012</p>
                    <p>KM: 67.000</p>
                    <div class="card-actions">
                        <a href="manutencoes.html" class="btn btn-small">Manutenções</a>
                        <a href="#" class="btn btn-small btn-danger">Excluir</a>
                    </div>
                </div>

            </div>
